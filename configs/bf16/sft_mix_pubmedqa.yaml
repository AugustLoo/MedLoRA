# 实验 C1: SLAKE SFT + PubMedQA 三分类回放 (不量化, bf16, 24-32 GB 单卡)
# 目的: CPT-only 评估表明 yes 偏置由短答式 SFT 引入, 试试在 SFT 数据里混入三分类样本能否保住 maybe。
# 与 configs/bf16/sft_slake_qlora.yaml 唯一的差别是 dataset 多了 pubmedqa_sft_train 与 output_dir。
# 前置: python data/convert_slake_sharegpt.py && python data/convert_pubmedqa_sft.py --per-class 300
# 运行: llamafactory-cli train configs/bf16/sft_mix_pubmedqa.yaml

### model
model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
freeze_vision_tower: true
freeze_multi_modal_projector: true

### dataset
dataset: slake_train,pubmedqa_sft_train
dataset_dir: data/processed
template: qwen2_vl
cutoff_len: 1024
image_max_pixels: 262144
overwrite_cache: true
preprocessing_num_workers: 1   # 5090 上 num_proc>1 会在 tokenizer 阶段挂死, 见 docs/SERVER.md

### output
output_dir: outputs/sft_mix_pubmedqa_r16
logging_steps: 10
save_steps: 400
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4   # 有效 batch 16, 与实验 A 一致
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
seed: 42

### eval
eval_dataset: slake_validation
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 400
