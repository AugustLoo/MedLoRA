# 由 scripts/make_bf16_configs.py 从 ../cpt_pubmed_qlora.yaml 派生: 不量化, bf16, batch 4 x 4 (24-32 GB 单卡)
# LLaMA-Factory 配置: 小规模 CPT (持续预训练), PubMedQA 文本语料
# 运行: llamafactory-cli train configs/cpt_pubmed_qlora.yaml
# 之后用 configs/sft_after_cpt.yaml 在这个 adapter 上继续 SFT (实验 B: CPT + SFT)

### model
model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
trust_remote_code: true

### method
stage: pt
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
freeze_vision_tower: true
freeze_multi_modal_projector: true

### dataset
dataset: pubmed_cpt
dataset_dir: data/processed
template: qwen2_vl
cutoff_len: 1024
packing: true
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: outputs/cpt_pubmed_qlora_r16
logging_steps: 10
save_steps: 500
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4   # 有效 batch 16
learning_rate: 5.0e-5            # CPT 学习率比 SFT 低, 减轻遗忘
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
seed: 42
