# 由 scripts/make_bf16_configs.py 从 ../sft_after_cpt_iu.yaml 派生: 不量化, bf16, batch 4 x 4 (24-32 GB 单卡)
# LLaMA-Factory 配置: 在 IU X-Ray 图文 CPT adapter 基础上继续 SLAKE SFT (实验 B2)
# 前置: 先跑完 configs/cpt_iu_qlora.yaml
# 运行: llamafactory-cli train configs/sft_after_cpt_iu.yaml
# 除 adapter_name_or_path / output_dir 外与 sft_slake_qlora.yaml 完全一致

### model
model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
adapter_name_or_path: outputs/cpt_iu_qlora_r16
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
freeze_vision_tower: true
freeze_multi_modal_projector: true

### dataset
dataset: slake_train
dataset_dir: data/processed
template: qwen2_vl
cutoff_len: 1024
image_max_pixels: 262144
overwrite_cache: true
preprocessing_num_workers: 8
preprocessing_batch_size: 64   # 进度条每 64 条跳一次, 否则一批 1000 条前一直显示 0%

### output
output_dir: outputs/sft_after_cpt_iu_r16
logging_steps: 10
save_steps: 400
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4   # 有效 batch 16
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
seed: 42

### eval
eval_dataset: slake_validation
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 400
