# 实验 C2-300-s43: C2-300 的第二个种子 (不量化, bf16, 24-32 GB 单卡)
# 目的: C1 证明 900 条有效 (macro-F1 +9.63, 代价 TextVQA -2.23)。C2 变动回放条数, 画出
# 「校准收益 vs 通用能力代价」的取舍曲线。本文件重复 300 条那一点, 用于估计运行间方差。
# 采样种子与训练种子一起换成 43: 我们要检验的是「加 300 条平衡回放」这个处理稳不稳,
# 不是「这特定 300 条」稳不稳。maybe 只有 55 条唯一样本, 换采样种子得到的重复组合不同,
# 这本身就是方差的主要来源之一。因此这是处理层面的重复, 不是纯训练种子的重复。
# 与 configs/bf16/sft_slake_qlora.yaml 唯一的差别是 dataset 多了 pubmedqa_sft_train 与 output_dir。
# 前置: python data/convert_pubmedqa_sft.py --per-class 100 --tag 300s43 --seed 43
# 运行: llamafactory-cli train configs/bf16/sft_mix_pubmedqa_300_s43.yaml

### model
model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
freeze_vision_tower: true
freeze_multi_modal_projector: true

### dataset
dataset: slake_train,pubmedqa_sft_train_300s43
dataset_dir: data/processed
template: qwen2_vl
cutoff_len: 1024
image_max_pixels: 262144
overwrite_cache: true
preprocessing_num_workers: 32
preprocessing_batch_size: 64   # 进度条每 64 条跳一次, 否则一批 1000 条前一直显示 0%

### output
output_dir: outputs/sft_mix_pubmedqa_300_s43_r16
logging_steps: 10
save_steps: 400
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4   # 有效 batch 16, 与实验 A 一致
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
seed: 43

### eval
eval_dataset: slake_validation
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 400

### 预处理线程
# 跑之前务必 export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1, 否则单张图处理耗时从 0.02 秒涨到 7.8 秒。
# 见 docs/SERVER.md 运维笔记。
