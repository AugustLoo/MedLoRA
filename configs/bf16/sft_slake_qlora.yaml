# 由 scripts/make_bf16_configs.py 从 ../sft_slake_qlora.yaml 派生: 不量化, bf16, batch 4 x 4 (24-32 GB 单卡)
# LLaMA-Factory 配置: SLAKE 上直接 QLoRA SFT (实验 A: 只 SFT)
# 运行: llamafactory-cli train configs/sft_slake_qlora.yaml
# T4 16GB 可跑; 4090/A100 把 quantization_bit 去掉、fp16 改 bf16、batch 调大。

### model
model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all          # 只对 LLM 的线性层加 LoRA, 视觉塔冻结
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
freeze_vision_tower: true
freeze_multi_modal_projector: true

### dataset
dataset: slake_train
dataset_dir: data/processed
template: qwen2_vl
cutoff_len: 1024
image_max_pixels: 262144  # 512*512, 与 eval 的 max_pixels 一致
overwrite_cache: true
preprocessing_num_workers: 8
preprocessing_batch_size: 64   # 进度条每 64 条跳一次, 否则一批 1000 条前一直显示 0%

### output
output_dir: outputs/sft_slake_qlora_r16
logging_steps: 10
save_steps: 400
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4   # 有效 batch 16
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
seed: 42

### eval
eval_dataset: slake_validation
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 400
